# Mobipi predictor configuration

name: mobipi
type: mobipi

# Path to 3DGS scene model root directory
scene_model_root_dir: ${paths.predictor_data.mobipi}/scene_data

# Image size for rendering (DINO encoder will auto-resize to 224x224)
image_size: 224

# Path to policy dataset
policy_dataset_path: ${env.dataset_path}

# Feature encoder type
encoder_type: dino

# Optimization parameters
num_init_samples: 10
bo_num_samples: 10

# On-site 3DGS reconstruction (on-site not implemented)
on_site_reconstruction: false

# Camera names for depth point cloud generation
camera_name: robot0_front_depth